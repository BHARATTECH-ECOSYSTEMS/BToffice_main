<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bharattech Origin | The Operating System for Intelligence</title>
    <meta name="description" content="Bharattech Origin is an Indian deep-technology research company building a unified intelligence infrastructure designed to learn, remember, reason and evolve." />
    <meta name="theme-color" content="#F7F2EA" />
    <script>
      (function () {
        // Light by default; a visitor's own choice (the nav's sun/moon) is remembered.
        var theme = 'light';
        try {
          var saved = localStorage.getItem('origin-theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0C0B10');
        // Lite mode for modest machines: ≤4 cores, ≤4 GB, "reduce transparency", or an integrated / software GPU
        // (Intel UHD and Iris on most Windows laptops, e.g. a first-generation Galaxy Book). Lite drops live blur and
        // full-screen blending, and the 3D renders at a lighter resolution without shadow maps.
        try {
          var lite = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4 || matchMedia('(prefers-reduced-transparency: reduce)').matches;
          if (!lite) {
            var gl = document.createElement('canvas').getContext('webgl');
            var dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
            var gpu = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : '';
            if (/Intel|Iris|UHD|HD Graphics|Mali|Adreno|PowerVR|SwiftShader|llvmpipe|Basic Render|Radeon\(TM\) Graphics|Radeon Graphics|Vega \d/i.test(gpu)) lite = true;
            var lose = gl && gl.getExtension('WEBGL_lose_context');
            if (lose) lose.loseContext();
          }
          if (lite) document.documentElement.classList.add('lite');
        } catch (e) {}
        // The opening plays once a session, on the first page, never with reduced motion (components/Opening.tsx);
        // and never leaves the page covered, whatever happens to the app.
        try {
          if (!sessionStorage.getItem('origin-intro') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('intro-on');
            window.__introBail = setTimeout(function () { document.documentElement.classList.remove('intro-on'); }, 6500);
          }
          sessionStorage.setItem('origin-intro', '1');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Geist+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
