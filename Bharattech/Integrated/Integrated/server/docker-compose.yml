services:
  screego:
    image: screego/server:1.10.3
    container_name: bharattech-screego
    restart: unless-stopped
    ports:
      - "5050:5050"
      - "3478:3478/tcp"
      - "3478:3478/udp"
    environment:
      - SCREEGO_SERVER_ADDRESS=0.0.0.0:5050
      - SCREEGO_SECRET=bharattech-screego-secret-2026
      - SCREEGO_EXTERNAL_IP=127.0.0.1
      - SCREEGO_LOG_LEVEL=info
      - SCREEGO_AUTH_MODE=turn
      - SCREEGO_CLOSE_ROOM_WHEN_OWNER_LEAVES=true
      - SCREEGO_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:5000,http://localhost:3000
    volumes:
      - ./screego.config.development:/screego.config:ro
      - ./users:/users:ro
