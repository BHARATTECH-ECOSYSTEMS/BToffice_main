<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bharattech Origin | The Operating System for Intelligence</title>
    <meta name="description" content="Bharattech Origin is an Indian deep-technology research company building a unified intelligence infrastructure designed to learn, remember, reason and evolve." />
    <meta name="theme-color" content="#08080C" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('origin-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
        // The opening plays once a visit, on the first page, never with reduced motion (components/Opening.tsx);
        // and never leaves the page covered, whatever happens to the app.
        try {
          if (!sessionStorage.getItem('origin-intro') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('intro-on');
            window.__introBail = setTimeout(function () { document.documentElement.classList.remove('intro-on'); }, 6000);
          }
          sessionStorage.setItem('origin-intro', '1');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
